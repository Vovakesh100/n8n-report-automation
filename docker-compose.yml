services:
  n8n:
    build: .
    image: n8n-report-automation:local
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Enable the Execute Command node (disabled by default in n8n 2.x).
      NODES_EXCLUDE: "[]"
      # Let workflow nodes read $env (blocked by default in n8n 2.x).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Values come from .env (copy .env.example), passed as references only.
      REPORT_CSV_PATH: ${REPORT_CSV_PATH}
      REPORT_FROM: ${REPORT_FROM}
      REPORT_TO: ${REPORT_TO}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      # Do not store execution data: the Telegram bot token is part of the HTTP Request URL
      # and would otherwise be saved in execution data. Set to "all" to undo (see docs/RUN.md).
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "none"
    volumes:
      - ./src:/app/src:ro
      - ./data:/data:ro
      - ./n8n_data:/home/node/.n8n
